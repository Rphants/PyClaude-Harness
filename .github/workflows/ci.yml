name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Compile-check prepare.py
        run: python -m py_compile prepare.py

      - name: Compile-check optimize.py
        run: python -m py_compile optimize.py

      - name: Compile-check harness/proposer.py
        run: python -m py_compile harness/proposer.py

      - name: Compile-check harness/evaluator.py
        run: python -m py_compile harness/evaluator.py

      - name: Compile-check harness/orchestrator.py
        run: python -m py_compile harness/orchestrator.py

      - name: Verify evaluation runs
        run: python prepare.py
